name: Backend CI/CD - Dockerize and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'oj_backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List all files for debugging
        run: ls -R

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./oj_backend 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oj_backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Debug Backend on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "--- (1) Navigating to project directory ---"
            cd ~/pico-code

            echo "--- (2) Verifying current location ---"
            pwd

            echo "--- (3) Listing files in current directory ---"
            ls -la

            echo "--- (4) Pulling latest images ---"
            docker compose pull
            
            echo "--- (5) Starting services ---"
            docker compose up -d --force-recreate --no-deps backend judge_worker
            
            echo "--- (6) Final cleanup ---"
            docker system prune -a -f