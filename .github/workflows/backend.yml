name: Backend CI/CD - Dockerize and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'oj_backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./oj_backend 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oj_backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker stop oj_backend-container || true
            docker rm oj_backend-container || true
            docker system prune -a -f
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/oj_backend:latest
            docker run -d --env-file ./.env --name oj_backend-container -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/oj_backend:latest